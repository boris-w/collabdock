name: Feature request / 功能建议
description: Suggest an idea or improvement. 提出新功能或改进建议。
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English or Chinese are both fine. 中英文均可。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What are you trying to do, and what gets in the way? 你想做什么，现在卡在哪里？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议的方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 涉及模块
      multiple: true
      options:
        - GitHub connector / GitHub 连接器
        - New connector (GitLab, Feishu, ...) / 新连接器
        - Trigger rules / 触发规则
        - AI engines (claude / codex / agy / lody) / AI 引擎
        - Worktree & workspace / 工作区
        - Review delivery / 结果回写
        - Menu bar UI & settings / 界面与设置
        - Usage stats / 用量统计
        - Packaging & distribution / 打包分发
        - Other / 其他
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
  - type: textarea
    id: extra
    attributes:
      label: Additional context / 其他信息
